<!DOCTYPE html>
<html lang="pt-br">

<head>

    <!-- Para aceitar caracteres especiais-->
    <meta charset="UTF-8" />
    <!-- Para aceitar em tamanhos de telas diferentes-->
    <meta name=" viewport" content="width=device-width" , initial-scale="1" />

    <!-- Importar css-->
    <link href="/css/style.css" rel="stylesheet">

    <!-- Adicionar favicon página-->
    <link rel="icon" type="image/svg+xml" href="/assets/logo_folha.png">

    <!-- titulo da pagina-->
    <title>Template 1</title>
</head>

<body>

    <!--Passadora voando-->
    <div class="birds aria-hidden=true">

        <!--passaro 1-->
        <div class="bird bird-1">
            <svg width="42" height="24" viewBox="0 0 32 18" fill="none">
                <path d="M0 14C5 5 9 2 16 9C23 2 27 5 32 14" stroke="rgba(255,255,255,.45)" stroke-width="2"
                    stroke-linecap="round" fill="none">
                    <animate attributeName="d"
                        values="M0 14C5 5 9 2 16 9C23 2 27 5 32 14;M0 9C5 12 9 14 16 9C23 14 27 12 32 9;M0 14C5 5 9 2 16 9C23 2 27 5 32 14"
                        dur="0.5s" repeatCount="indefinite" />
                </path>
            </svg>
        </div>

        <!--passaro 2-->
        <div class="bird bird-2">
            <svg width="22" height="13" viewBox="0 0 32 18" fill="none">
                <path d="M0 14C5 5 9 2 16 9C23 2 27 5 32 14" stroke="rgba(255,255,255,.4)" stroke-width="2.5"
                    stroke-linecap="round" fill="none">
                    <animate attributeName="d"
                        values="M0 14C5 5 9 2 16 9C23 2 27 5 32 14;M0 9C5 12 9 14 16 9C23 14 27 12 32 9;M0 14C5 5 9 2 16 9C23 2 27 5 32 14"
                        dur="0.45s" repeatCount="indefinite" />
                </path>
            </svg>
        </div>

        <div class="bird bird-3">
            <svg width="32" height="18" viewBox="0 0 32 18" fill="none">
                <path d="M0 14C5 5 9 2 16 9C23 2 27 5 32 14" stroke="rgba(255,255,255,.35)" stroke-width="2"
                    stroke-linecap="round" fill="none">
                    <animate attributeName="d"
                        values="M0 14C5 5 9 2 16 9C23 2 27 5 32 14;M0 9C5 12 9 14 16 9C23 14 27 12 32 9;M0 14C5 5 9 2 16 9C23 2 27 5 32 14"
                        dur="0.55s" repeatCount="indefinite" />
                </path>
            </svg>
        </div>

    </div>

    <header>
        <nav class="">

        </nav>
    </header>
</body>

</html>
